оservices:
  db:
    image: postgres:16-alpine
    container_name: booking_meeting_room_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_meeting_room}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      TZ: Asia/Yekaterinburg
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-booking_meeting_room}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build:
      context: .
    container_name: booking_meeting_room_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-booking_meeting_room}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      TZ: Asia/Yekaterinburg
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
